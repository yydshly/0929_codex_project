<text x="84" y="2448" font-size="27" fill="#ffffff" font-weight="600">与 Voicebox 的取舍：基础能力大量重叠；比较所选模型与已完成的制作流程，再决定是否接入。</text>
<text x="84" y="2485" font-size="24" fill="#cde1cf" font-weight="400">最小评估：同一份录音与文稿，比较读音、音色、漏字、总耗时和修改步骤；简单串接可做原型，稳定制作需要工程处理。</text>
<text x="60" y="2553" font-size="22" fill="#577168" font-weight="400">使用条件：本地部署需要模型与算力；全离线要覆盖识别、翻译和合成全链路。应用 AGPL-3.0，默认 OmniVoice 权重 CC-BY-NC，分别核对。</text>
<text x="60" y="2592" font-size="22" fill="#577168" font-weight="400">验证范围：固定版本资料与源码研究；未运行本机语音模型、未验证数字人组合或实时性能。本图中的使用路线为后续建议。</text>
