<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2710" viewBox="0 0 1800 2710" role="img" aria-labelledby="title desc"><title id="title">VoiceStudio 完整能力汇报</title><desc id="desc">VoiceStudio 是调用语音模型的应用工作台，不是独立基础大模型；可以提供数字人的声音环节。图中说明八类能力、十个模块、模型原理、数字人组合、使用场景、长期价值与四步使用路径。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#21775e"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif}</style>
<rect x="0" y="0" width="1800" height="2710" rx="0" fill="#f4f5ee" stroke="none"/>
<rect x="0" y="0" width="1800" height="310" rx="0" fill="#183f38" stroke="none"/>
<text x="60" y="52" font-size="23" fill="#b9d8bd" font-weight="600">011 / 项目能力汇报 / 固定版本 eef0e23</text>
<text x="60" y="121" font-size="51" fill="#ffffff" font-weight="700">VoiceStudio：把文字与素材，做成可用的声音</text>
<text x="60" y="175" font-size="28" fill="#d6e8d6" font-weight="400">它是语音制作工作台：整合模型、音频工具与任务流程，交付配音、转写和有声内容。</text>
<rect x="60" y="210" width="548" height="65" rx="18" fill="#29534a" stroke="none"/>
<text x="80" y="251" font-size="23" fill="#b9d8bd" font-weight="700">本质</text>
<text x="190" y="251" font-size="25" fill="#fffefa" font-weight="600">应用与模型编排系统</text>
<rect x="626" y="210" width="548" height="65" rx="18" fill="#29534a" stroke="none"/>
<text x="646" y="251" font-size="23" fill="#b9d8bd" font-weight="700">大模型？</text>
<text x="756" y="251" font-size="25" fill="#fffefa" font-weight="600">自身不是；底层调用模型</text>
<rect x="1192" y="210" width="548" height="65" rx="18" fill="#29534a" stroke="none"/>
<text x="1212" y="251" font-size="23" fill="#b9d8bd" font-weight="700">数字人？</text>
<text x="1322" y="251" font-size="25" fill="#fffefa" font-weight="600">可提供语音，非完整数字人</text>
<text x="60" y="370" font-size="23" fill="#21775e" font-weight="700">01</text>
<text x="112" y="370" font-size="34" fill="#183f38" font-weight="700">本身能做什么？</text>
<text x="112" y="410" font-size="23" fill="#577168" font-weight="400">八类能力：重点看输入与产物；实际效果由所选模型、素材和硬件共同决定。</text>
<rect x="60" y="437" width="405" height="140" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="82" y="476" font-size="28" fill="#183f38" font-weight="700">文字配音</text>
<text x="82" y="516" font-size="23" fill="#577168" font-weight="400">文稿 + 选定声音</text>
<text x="82" y="549" font-size="23" fill="#577168" font-weight="400">→ 旁白、朗读音频</text>
<rect x="485" y="437" width="405" height="140" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="507" y="476" font-size="28" fill="#183f38" font-weight="700">声音克隆</text>
<text x="507" y="516" font-size="23" fill="#577168" font-weight="400">参考录音 + 新文稿</text>
<text x="507" y="549" font-size="23" fill="#577168" font-weight="400">→ 相似音色的新语音</text>
<rect x="910" y="437" width="405" height="140" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="932" y="476" font-size="28" fill="#183f38" font-weight="700">声音设计</text>
<text x="932" y="516" font-size="23" fill="#577168" font-weight="400">年龄、音高、口音等属性</text>
<text x="932" y="549" font-size="23" fill="#577168" font-weight="400">→ 新角色或旁白声音</text>
<rect x="1335" y="437" width="405" height="140" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="1357" y="476" font-size="28" fill="#183f38" font-weight="700">视频翻译配音</text>
<text x="1357" y="516" font-size="23" fill="#577168" font-weight="400">视频 → 识别 → 翻译 → 合成</text>
<text x="1357" y="549" font-size="23" fill="#577168" font-weight="400">→ 按片段适配的配音视频</text>
<rect x="60" y="597" width="405" height="140" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="82" y="636" font-size="28" fill="#183f38" font-weight="700">语音识别 / 听写</text>
<text x="82" y="676" font-size="23" fill="#577168" font-weight="400">录音或麦克风输入</text>
<text x="82" y="709" font-size="23" fill="#577168" font-weight="400">→ 可编辑文字与时间信息</text>
<rect x="485" y="597" width="405" height="140" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="507" y="636" font-size="28" fill="#183f38" font-weight="700">故事 / 有声书</text>
<text x="507" y="676" font-size="23" fill="#577168" font-weight="400">章节、角色、停顿设置</text>
<text x="507" y="709" font-size="23" fill="#577168" font-weight="400">→ 多角色与分章长音频</text>
<rect x="910" y="597" width="405" height="140" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="932" y="636" font-size="28" fill="#183f38" font-weight="700">批量任务</text>
<text x="932" y="676" font-size="23" fill="#577168" font-weight="400">一组音频或视频任务</text>
<text x="932" y="709" font-size="23" fill="#577168" font-weight="400">→ 排队制作、进度与结果</text>
<rect x="1335" y="597" width="405" height="140" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="1357" y="636" font-size="28" fill="#183f38" font-weight="700">API / MCP 接入</text>
<text x="1357" y="676" font-size="23" fill="#577168" font-weight="400">其他程序提交生成或转写请求</text>
<text x="1357" y="709" font-size="23" fill="#577168" font-weight="400">→ 音频资源、文字与声音列表</text>
<text x="60" y="811" font-size="23" fill="#21775e" font-weight="700">02</text>
<text x="112" y="811" font-size="34" fill="#183f38" font-weight="700">内部有哪些模块，各自负责什么？</text>
<text x="112" y="851" font-size="23" fill="#577168" font-weight="400">按职责归纳十组模块；实际源码分布更细。流程调用工具，工具再调用模型。</text>
<rect x="60" y="879" width="320" height="164" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="78" y="916" font-size="26" fill="#183f38" font-weight="700">01 · 桌面工作区</text>
<text x="78" y="948" font-size="20" fill="#21775e" font-weight="400">Electron / React</text>
<text x="78" y="985" font-size="22" fill="#577168" font-weight="400">管理文稿、声音和视频</text>
<text x="78" y="1017" font-size="22" fill="#577168" font-weight="400">提供编辑、试听与任务界面</text>
<rect x="400" y="879" width="320" height="164" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="418" y="916" font-size="26" fill="#183f38" font-weight="700">02 · 服务与入口</text>
<text x="418" y="948" font-size="20" fill="#21775e" font-weight="400">FastAPI / API / MCP</text>
<text x="418" y="985" font-size="22" fill="#577168" font-weight="400">接收用户或程序请求</text>
<text x="418" y="1017" font-size="22" fill="#577168" font-weight="400">分发任务并返回结果</text>
<rect x="740" y="879" width="320" height="164" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="758" y="916" font-size="26" fill="#183f38" font-weight="700">03 · 模型与设备</text>
<text x="758" y="948" font-size="20" fill="#21775e" font-weight="400">模型加载 / 资源调度</text>
<text x="758" y="985" font-size="22" fill="#577168" font-weight="400">选择引擎与执行设备</text>
<text x="758" y="1017" font-size="22" fill="#577168" font-weight="400">加载卸载、控制资源占用</text>
<rect x="1080" y="879" width="320" height="164" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="1098" y="916" font-size="26" fill="#183f38" font-weight="700">04 · 语音合成</text>
<text x="1098" y="948" font-size="20" fill="#21775e" font-weight="400">tts_backend</text>
<text x="1098" y="985" font-size="22" fill="#577168" font-weight="400">统一不同 TTS 引擎</text>
<text x="1098" y="1017" font-size="22" fill="#577168" font-weight="400">文字与声音条件 → 音频</text>
<rect x="1420" y="879" width="320" height="164" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="1438" y="916" font-size="26" fill="#183f38" font-weight="700">05 · 识别与对齐</text>
<text x="1438" y="948" font-size="20" fill="#21775e" font-weight="400">asr_backend</text>
<text x="1438" y="985" font-size="22" fill="#577168" font-weight="400">将语音转成文字</text>
<text x="1438" y="1017" font-size="22" fill="#577168" font-weight="400">为片段处理提供时间基础</text>
<rect x="60" y="1061" width="320" height="164" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="78" y="1098" font-size="26" fill="#183f38" font-weight="700">06 · 视频前处理</text>
<text x="78" y="1130" font-size="20" fill="#21775e" font-weight="400">dub_pipeline</text>
<text x="78" y="1167" font-size="22" fill="#577168" font-weight="400">提取音轨、分离人声</text>
<text x="78" y="1199" font-size="22" fill="#577168" font-weight="400">缓存素材、记录任务状态</text>
<rect x="400" y="1061" width="320" height="164" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="418" y="1098" font-size="26" fill="#183f38" font-weight="700">07 · 翻译与改写</text>
<text x="418" y="1130" font-size="20" fill="#21775e" font-weight="400">translator</text>
<text x="418" y="1167" font-size="22" fill="#577168" font-weight="400">翻译原文、调整表达</text>
<text x="418" y="1199" font-size="22" fill="#577168" font-weight="400">结合上下文改写配音稿</text>
<rect x="740" y="1061" width="320" height="164" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="758" y="1098" font-size="26" fill="#183f38" font-weight="700">08 · 长文分块</text>
<text x="758" y="1130" font-size="20" fill="#21775e" font-weight="400">chunked_tts</text>
<text x="758" y="1167" font-size="22" fill="#577168" font-weight="400">按句拆分长文本合成</text>
<text x="758" y="1199" font-size="22" fill="#577168" font-weight="400">处理衔接、拼接连续音频</text>
<rect x="1080" y="1061" width="320" height="164" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="1098" y="1098" font-size="26" fill="#183f38" font-weight="700">09 · 章节与角色</text>
<text x="1098" y="1130" font-size="20" fill="#21775e" font-weight="400">audiobook</text>
<text x="1098" y="1167" font-size="22" fill="#577168" font-weight="400">解析章节、声音和停顿</text>
<text x="1098" y="1199" font-size="22" fill="#577168" font-weight="400">组织多角色有声书</text>
<rect x="1420" y="1061" width="320" height="164" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="1438" y="1098" font-size="26" fill="#183f38" font-weight="700">10 · 后处理与导出</text>
<text x="1438" y="1130" font-size="20" fill="#21775e" font-weight="400">音频处理 / 媒体封装</text>
<text x="1438" y="1167" font-size="22" fill="#577168" font-weight="400">适配时长、混音与响度</text>
<text x="1438" y="1199" font-size="22" fill="#577168" font-weight="400">封装可保存的成品文件</text>
<rect x="60" y="1258" width="1680" height="158" rx="18" fill="#e6ede0" stroke="none"/>
<text x="84" y="1298" font-size="28" fill="#183f38" font-weight="700">底层模型 ≠ VoiceStudio 本身</text>
<text x="84" y="1337" font-size="24" fill="#577168" font-weight="400">语音合成：默认 OmniVoice，也可选其他引擎  ｜  语音识别：WhisperX 等  ｜  翻译 / 改写：可接 LLM  ｜  人声分离：专用模型</text>
<text x="84" y="1380" font-size="25" fill="#183f38" font-weight="400">默认克隆原理：参考音频与文字提供条件 → 迭代补全声音符号 → 解码成音频；通常无需为每个声音重新训练。</text>
<text x="60" y="1480" font-size="23" fill="#21775e" font-weight="700">03</text>
<text x="112" y="1480" font-size="34" fill="#183f38" font-weight="700">它在数字人方案里处于什么位置？</text>
<text x="112" y="1520" font-size="23" fill="#577168" font-weight="400">它可以提供“声音制作”这一环；形象、口型、表情、动作和画面由另外的系统负责。</text>
<rect x="60" y="1548" width="304" height="100" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="80" y="1588" font-size="27" fill="#183f38" font-weight="700">文稿 / 对话回复</text>
<text x="80" y="1624" font-size="22" fill="#577168" font-weight="400">人工编写或其他模型</text>
<path d="M372,1598h23" fill="none" stroke="#21775e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="404" y="1548" width="304" height="100" rx="18" fill="#183f38" stroke="none"/>
<text x="424" y="1588" font-size="27" fill="#ffffff" font-weight="700">VoiceStudio</text>
<text x="424" y="1624" font-size="22" fill="#d6e8d6" font-weight="400">合成 / 克隆 / 配音</text>
<path d="M716,1598h23" fill="none" stroke="#21775e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="748" y="1548" width="304" height="100" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="768" y="1588" font-size="27" fill="#183f38" font-weight="700">音频文件或资源</text>
<text x="768" y="1624" font-size="22" fill="#577168" font-weight="400">交给后续应用</text>
<path d="M1060,1598h23" fill="none" stroke="#21775e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1092" y="1548" width="304" height="100" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="1112" y="1588" font-size="27" fill="#183f38" font-weight="700">数字人引擎</text>
<text x="1112" y="1624" font-size="22" fill="#577168" font-weight="400">Duix / LiveTalking 等</text>
<path d="M1404,1598h23" fill="none" stroke="#21775e" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1436" y="1548" width="304" height="100" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="1456" y="1588" font-size="27" fill="#183f38" font-weight="700">有声人物画面</text>
<text x="1456" y="1624" font-size="22" fill="#577168" font-weight="400">渲染、合成与播放</text>
<text x="60" y="1690" font-size="25" fill="#577168" font-weight="400">建议先做文件级组合：配音完成 → 驱动口型 → 导出视频。实时对话还需另行验证延迟、流式传输、打断与同步。</text>
<text x="60" y="1764" font-size="23" fill="#21775e" font-weight="700">04</text>
<text x="112" y="1764" font-size="34" fill="#183f38" font-weight="700">使用场景 → 对我们后期的价值</text>
<text x="112" y="1804" font-size="23" fill="#577168" font-weight="400">把已有研究成果、声音资产和制作流程重复使用；以下为应用建议，尚未完成跨项目集成。</text>
<rect x="60" y="1832" width="548" height="236" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="84" y="1873" font-size="29" fill="#183f38" font-weight="700">研究与内容制作</text>
<text x="84" y="1915" font-size="25" fill="#577168" font-weight="400">研究摘要 → 一分钟旁白</text>
<text x="84" y="1952" font-size="25" fill="#577168" font-weight="400">屏幕教程 → 配音 / 多语言版本</text>
<path d="M84,1968h500" stroke="#d2ded3"/>
<text x="84" y="2004" font-size="24" fill="#21775e" font-weight="400">让现有研究多一种传播方式</text>
<text x="84" y="2039" font-size="24" fill="#21775e" font-weight="400">逐句修改，减少重复录制</text>
<rect x="626" y="1832" width="548" height="236" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="650" y="1873" font-size="29" fill="#183f38" font-weight="700">知识与声音资产</text>
<text x="650" y="1915" font-size="25" fill="#577168" font-weight="400">笔记、章节 → 个人知识音频库</text>
<text x="650" y="1952" font-size="25" fill="#577168" font-weight="400">系列内容 → 固定声音与角色</text>
<path d="M650,1968h500" stroke="#d2ded3"/>
<text x="650" y="2004" font-size="24" fill="#21775e" font-weight="400">积累可复用的声音和文稿模板</text>
<text x="650" y="2039" font-size="24" fill="#21775e" font-weight="400">让内容适合离屏收听与回顾</text>
<rect x="1192" y="1832" width="548" height="236" rx="18" fill="#fffefa" stroke="#d2ded3"/>
<text x="1216" y="1873" font-size="29" fill="#183f38" font-weight="700">助手与数字人产品</text>
<text x="1216" y="1915" font-size="25" fill="#577168" font-weight="400">API / MCP → 个人助手发声</text>
<text x="1216" y="1952" font-size="25" fill="#577168" font-weight="400">音频输出 → 数字人口播素材</text>
<path d="M1216,1968h500" stroke="#d2ded3"/>
<text x="1216" y="2004" font-size="24" fill="#21775e" font-weight="400">把语音模块与业务、画面分开维护</text>
<text x="1216" y="2039" font-size="24" fill="#21775e" font-weight="400">按需要更换模型和下游工具</text>
<text x="60" y="2136" font-size="23" fill="#21775e" font-weight="700">05</text>
<text x="112" y="2136" font-size="34" fill="#183f38" font-weight="700">后期怎么拿来用？按四步逐渐接入</text>
<text x="112" y="2176" font-size="23" fill="#577168" font-weight="400">优先采用现成工作台与接口；只有具体任务缺能力时，再考虑开发扩展。</text>
<rect x="60" y="2204" width="405" height="180" rx="18" fill="#e6ede0" stroke="none"/>
<text x="80" y="2244" font-size="26" fill="#183f38" font-weight="700">1 / 先跑通一个小任务</text>
<text x="80" y="2284" font-size="23" fill="#577168" font-weight="400">安装应用与所需模型</text>
<text x="80" y="2319" font-size="23" fill="#577168" font-weight="400">用自有录音 + 60 秒中文稿</text>
<text x="80" y="2354" font-size="23" fill="#577168" font-weight="400">试听读音、音色和修改成本</text>
<rect x="485" y="2204" width="405" height="180" rx="18" fill="#e6ede0" stroke="none"/>
<text x="505" y="2244" font-size="26" fill="#183f38" font-weight="700">2 / 再自动化重复制作</text>
<text x="505" y="2284" font-size="23" fill="#577168" font-weight="400">通过 API / MCP 提交文稿</text>
<text x="505" y="2319" font-size="23" fill="#577168" font-weight="400">固定声音、文件命名与输出</text>
<text x="505" y="2354" font-size="23" fill="#577168" font-weight="400">加入进度、失败处理和复核</text>
<rect x="910" y="2204" width="405" height="180" rx="18" fill="#e6ede0" stroke="none"/>
<text x="930" y="2244" font-size="26" fill="#183f38" font-weight="700">3 / 连接现有内容工具</text>
<text x="930" y="2284" font-size="23" fill="#577168" font-weight="400">先把音频接入剪辑或数字人</text>
<text x="930" y="2319" font-size="23" fill="#577168" font-weight="400">核对采样率、时长和格式</text>
<text x="930" y="2354" font-size="23" fill="#577168" font-weight="400">验证口型、节奏与整条流程</text>
<rect x="1335" y="2204" width="405" height="180" rx="18" fill="#e6ede0" stroke="none"/>
<text x="1355" y="2244" font-size="26" fill="#183f38" font-weight="700">4 / 按瓶颈扩展能力</text>
