name: Publish research website

on:
  push:
    branches: [main]
    paths:
      - 'projects/001-awesome-agent-skills/**'
      - 'projects/002-agent-skills/**'
      - 'projects/003-mattpocock-skills/**'
      - 'projects/004-mengto-skills/**'
      - 'projects/005-skills-hub/**'
      - 'projects/007-ojo-design-skills/**'
      - 'projects/006-jakubkrehel-skills/**'
      - 'projects/008-handraw-style/**'
      - 'projects/009-duix-avatar/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build Chinese skill research
        run: node projects/001-awesome-agent-skills/web/build.mjs
      - name: Verify coverage and local links
        run: node projects/001-awesome-agent-skills/web/verify.mjs
      - name: Verify Agent Skills research and diagrams
        run: node projects/002-agent-skills/web/verify.mjs
      - name: Build and verify Matt Pocock Skills summary
        run: |
          node projects/003-mattpocock-skills/build-web.mjs
          node projects/003-mattpocock-skills/verify-web.mjs
      - name: Build and verify MengTo Skills research
        run: |
          python3 projects/004-mengto-skills/scripts/build_web.py
          python3 projects/004-mengto-skills/scripts/verify_web.py
      - uses: actions/configure-pages@v5
      - name: Build and verify Skills Hub research
        run: |
          node projects/005-skills-hub/web/build.mjs
          node projects/005-skills-hub/web/verify.mjs
      - name: Build and verify Jakub Krehel Skills research
        run: |
          node projects/006-jakubkrehel-skills/web/build.mjs
          node projects/006-jakubkrehel-skills/web/verify.mjs
          python3 projects/006-jakubkrehel-skills/scripts/verify.py
      - name: Build and verify OJO Design Skills summary
        run: |
          python3 projects/007-ojo-design-skills/scripts/build.py
          python3 projects/007-ojo-design-skills/scripts/verify.py
      - name: Build and verify Handraw Style showcase
        run: |
          node projects/008-handraw-style/web/build.mjs
          node projects/008-handraw-style/web/verify.mjs
      - name: Build and verify Duix Avatar research
        run: |
          node projects/009-duix-avatar/web/build.mjs
          node projects/009-duix-avatar/web/verify.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
