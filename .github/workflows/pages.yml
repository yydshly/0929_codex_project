name: Publish research website

on:
  push:
    branches: [main]
    paths:
      - 'projects/001-awesome-agent-skills/**'
      - 'projects/002-agent-skills/**'
      - 'projects/004-mengto-skills/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build Chinese skill research
        run: node projects/001-awesome-agent-skills/web/build.mjs
      - name: Verify coverage and local links
        run: node projects/001-awesome-agent-skills/web/verify.mjs
      - name: Verify Agent Skills research and diagrams
        run: node projects/002-agent-skills/web/verify.mjs
      - name: Build and verify MengTo Skills research
        run: |
          python3 projects/004-mengto-skills/scripts/build_web.py
          python3 projects/004-mengto-skills/scripts/verify_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
