<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duix Avatar · 一图读懂</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#253c33;font:14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}header{display:flex;align-items:center;gap:23px;flex-wrap:wrap;padding:17px 25px;border-bottom:1px solid #d5ddd0;background:#fff}a{color:inherit;text-underline-offset:4px}button{font:inherit;border:1px solid #bac8b4;background:#fff;padding:6px 14px;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #bd462c;outline-offset:3px}h1{margin:0;font-size:18px;font-weight:650}label{display:flex;align-items:center;gap:10px;margin-left:auto}input{max-width:130px;accent-color:#4f715b}p{font-size:12px;color:#5b6e60;margin:12px 25px}.canvas{overflow:auto;padding:18px;max-height:calc(100vh - 150px)}img{display:block;width:100%;max-width:none;height:auto;margin:auto}@media(max-width:600px){header{gap:13px;padding:14px 18px}h1{width:100%;order:-1}label{margin-left:0}p{margin:12px 18px}.canvas{padding:8px;max-height:calc(100vh - 220px)}}</style></head><body><header><a href="index.html#summary-map">← 返回能力展示</a><h1>Duix Avatar · 一图读懂</h1><label>缩放 <input id="zoom" aria-label="总览图缩放" type="range" min="100" max="300" step="25" value="100"><output id="value" for="zoom">100%</output></label><button id="fit">适应宽度</button><a href="capability-summary.png" download>下载原图 PNG ↓</a></header><p>能力、输入输出、技术原理、模型、软硬件、效果边界、场景与个人意义。研究示意，非 Duix 生成样片；可放大后横向滚动阅读。</p><main class="canvas"><img id="map" src="capability-summary.png" width="1536" height="1024" alt="Duix Avatar 一图读懂：人物视频配合目标文案或音频，经过素材处理、FunASR 识别、Fish Speech 语音生成与 Duix 视频服务，生成数字人口播；附硬件软件依赖、六项能力、效果边界、场景与对当前研究工作的意义。"></main><script>const zoom=document.querySelector('#zoom'),map=document.querySelector('#map'),value=document.querySelector('#value');function update(){map.style.width=zoom.value+'%';value.textContent=zoom.value+'%'}zoom.addEventListener('input',update);document.querySelector('#fit').addEventListener('click',()=>{zoom.value='100';update();document.querySelector('.canvas').scrollTo(0,0)});</script></body></html>
