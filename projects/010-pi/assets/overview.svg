<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-label="Pi 能力、原理、模块与场景总览"><rect width="1600" height="1060" fill="#f5f4eb"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="65" y="80" font-size="46" fill="#22392a" font-weight="700">Pi / 从目标到行动</text><text x="65" y="127" font-size="25" fill="#26382b" font-weight="400">Agent 执行基础 + 可直接使用的终端助手</text><text x="65" y="170" font-size="23" fill="#26382b" font-weight="400">模型做判断 · Pi 组织上下文和运行 · 工具执行真实动作 · 人与检查程序验收</text><rect x="65" y="205" width="470" height="220" rx="18" fill="#e2eacb"/><text x="90" y="255" font-size="28" fill="#22392a" font-weight="700">能完成什么</text><text x="90" y="305" font-size="22" fill="#26382b" font-weight="400">读代码、写文档、改文件</text><text x="90" y="345" font-size="22" fill="#26382b" font-weight="400">运行命令、反馈报错、继续修正</text><text x="90" y="385" font-size="22" fill="#26382b" font-weight="400">保存会话、恢复任务、探索分支</text><rect x="565" y="205" width="470" height="220" rx="18" fill="#e6ecde"/><text x="590" y="255" font-size="28" fill="#22392a" font-weight="700">如何定制</text><text x="590" y="305" font-size="22" fill="#26382b" font-weight="400">模板和 Skills：复用工作方法</text><text x="590" y="345" font-size="22" fill="#26382b" font-weight="400">扩展：加入业务工具和事件处理</text><text x="590" y="385" font-size="22" fill="#26382b" font-weight="400">SDK / RPC：接入自己的产品</text><rect x="1065" y="205" width="470" height="220" rx="18" fill="#e9e5d7"/><text x="1090" y="255" font-size="28" fill="#22392a" font-weight="700">能留下什么</text><text x="1090" y="305" font-size="22" fill="#26382b" font-weight="400">代码差异、文档与处理结果</text><text x="1090" y="345" font-size="22" fill="#26382b" font-weight="400">命令输出、测试记录与会话</text><text x="1090" y="385" font-size="22" fill="#26382b" font-weight="400">专用助手原型和可复用方法</text><text x="65" y="485" font-size="28" fill="#22392a" font-weight="700">一次任务的执行循环</text><rect x="65" y="515" width="220" height="100" rx="12" fill="#fff" stroke="#c3ceb7"/><text x="82" y="553" font-size="24" fill="#22392a" font-weight="600">1. 给出目标</text><text x="82" y="590" font-size="17" fill="#26382b" font-weight="400">人 / 宿主应用</text><text x="293" y="575" font-size="25" fill="#26382b" font-weight="400">→</text><rect x="315" y="515" width="220" height="100" rx="12" fill="#fff" stroke="#c3ceb7"/><text x="332" y="553" font-size="24" fill="#22392a" font-weight="600">2. 准备上下文</text><text x="332" y="590" font-size="17" fill="#26382b" font-weight="400">Pi 会话层</text><text x="543" y="575" font-size="25" fill="#26382b" font-weight="400">→</text><rect x="565" y="515" width="220" height="100" rx="12" fill="#fff" stroke="#c3ceb7"/><text x="582" y="553" font-size="24" fill="#22392a" font-weight="600">3. 决定下一步</text><text x="582" y="590" font-size="17" fill="#26382b" font-weight="400">大模型</text><text x="793" y="575" font-size="25" fill="#26382b" font-weight="400">→</text><rect x="815" y="515" width="220" height="100" rx="12" fill="#fff" stroke="#c3ceb7"/><text x="832" y="553" font-size="24" fill="#22392a" font-weight="600">4. 执行真实动作</text><text x="832" y="590" font-size="17" fill="#26382b" font-weight="400">Pi + 工具实现</text><text x="1043" y="575" font-size="25" fill="#26382b" font-weight="400">→</text><rect x="1065" y="515" width="220" height="100" rx="12" fill="#fff" stroke="#c3ceb7"/><text x="1082" y="553" font-size="24" fill="#22392a" font-weight="600">5. 反馈并继续</text><text x="1082" y="590" font-size="17" fill="#26382b" font-weight="400">Pi + 大模型</text><text x="1293" y="575" font-size="25" fill="#26382b" font-weight="400">→</text><rect x="1315" y="515" width="220" height="100" rx="12" fill="#fff" stroke="#c3ceb7"/><text x="1332" y="553" font-size="24" fill="#22392a" font-weight="600">6. 交付与验收</text><text x="1332" y="590" font-size="17" fill="#26382b" font-weight="400">Pi + 人 / 检查程序</text><text x="65" y="654" font-size="22" fill="#26382b" font-weight="400">工具结果仍需处理 → 回到模型判断；对话分支不自动回滚文件，压缩不等于准确永久记忆。</text><text x="65" y="718" font-size="28" fill="#22392a" font-weight="700">七个公开模块</text><text x="65" y="765" font-size="22" fill="#26382b" font-weight="400">pi-ai / 模型接入     pi-agent-core / 执行循环     pi-coding-agent / 助手与集成     pi-tui / 终端界面</text><text x="65" y="809" font-size="22" fill="#26382b" font-weight="400">pi-durable / 持久化记录     chord / 应用组成     pi-telemetry / 诊断契约</text><text x="65" y="877" font-size="28" fill="#22392a" font-weight="700">对你的价值</text><text x="65" y="924" font-size="24" fill="#26382b" font-weight="400">理解 Agent 原理 → 固化自己的研究方法 → 增加业务工具 → 构建专用 Agent 产品</text><text x="65" y="985" font-size="19" fill="#5e6d60" font-weight="400">固定版本 4df1574 / 2026-09-29 · 原创研究示意 · 上游未运行，成果为能力示例</text></g></svg>