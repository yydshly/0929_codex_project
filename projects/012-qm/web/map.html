<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一张图读懂 QM</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#14243b;font:15px/1.7 'Microsoft YaHei',sans-serif}header{padding:15px 22px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dce2e9}a{color:#2352b6}button,input{font:inherit}button{padding:6px 14px;cursor:pointer}label{display:flex;gap:10px}main{padding:15px;overflow:auto}img{display:block;width:100%;max-width:1200px;height:auto;margin:auto}p{font-size:12px;margin:10px 22px}</style></head><body><header><a href="index.html#summary">← 返回 QM 摘要</a><label>缩放 <input aria-label="摘要图缩放" type="range" min="100" max="240" step="20" value="100"></label><button>适应宽度</button><a href="qm-overview.png" download>下载原图</a></header><p>本轮确认的摘要图 · 能力与场景为研究归纳，采用时机为建议；上游未部署实测。</p><main><img src="qm-overview.png" alt="QM 的本质、能力、场景、价值与采用时机完整摘要图"></main><script>const zoom=document.querySelector('input'),img=document.querySelector('img');zoom.addEventListener('input',()=>{img.style.maxWidth='none';img.style.width=zoom.value+'%'});document.querySelector('button').addEventListener('click',()=>{zoom.value=100;img.style.width='100%';img.style.maxWidth='1200px'});</script></body></html>
